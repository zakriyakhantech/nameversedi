[build]
  publish = "dist"
  command = "npm run build"

# Trailing-slash cleanup — canonical form is no trailing slash (301 permanent redirect)
# Catches ALL routes, not just /names/ — e.g. /names/islamic/safinaz/ → /names/islamic/safinaz
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

# Security headers applied to all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets aggressively
[[headers]]
  for = "assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap and robots.txt should refresh periodically
[[headers]]
  for = "sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
